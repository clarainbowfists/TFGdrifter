<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Drifter tracking</title>

    <!-- LEAFLET -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            margin: 0;

            padding: 0;

            background-color: #f2f2f2;

            display: flex;

            flex-direction: column;

            min-height: 100vh;
        }

        header {

            background-color: #004080;

            color: white;

            padding: 15px 20px;

            display: flex;

            align-items: center;
        }

        h1 {

            margin: 0;

            font-size: 24px;

            margin-left: 10px;
        }

        img.logo {

            height: 40px;

            margin-right: 10px;
        }

        a {

            color: white;

            text-decoration: none;

            padding: 8px 12px;

            background-color: #0066cc;

            border-radius: 5px;

            margin-left: auto;
        }

        a:hover {

            background-color: #003366;
        }

        main {

            padding: 40px;

            flex: 1;
        }

        #telemetry {

            background-color: white;

            padding: 20px;

            border-radius: 10px;

            margin-top: 20px;

            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        #telemetry p {

            margin: 10px 0;

            font-size: 16px;
        }

        #map {

            height: 450px;

            margin-top: 20px;

            border-radius: 10px;
        }

        canvas {

            background-color: white;

            border-radius: 10px;

            padding: 20px;

            margin-top: 20px;
        }

        footer {

            background-color: #004080;

            color: white;

            text-align: center;

            padding: 10px;
        }

    </style>

</head>

<body>

    <header>

        <img src="./static/assets/medusablanca.png"
            alt="Logo"
            class="logo">

        <img src="./static/assets/logoobseablanco.png"
            alt="Logo"
            class="logo">

        <h1>Drifter tracking</h1>

        <a href="https://www.obsea.es/"
           target="_blank">

            Home

        </a>

    </header>

    <main>

        <p>

            On this page, temperature measures, location and datetime
            taken by drifters are published.

        </p>
        <div style="margin-bottom: 20px;">
            <label>Device ID:</label>
            <input type="text" id="deviceInput" value="217475">

            <label>From:</label>
            <input type="datetime-local" id="fromDate">

            <label>To:</label>
            <input type="datetime-local" id="toDate">

            <button onclick="loadTelemetry()">Update</button>
        </div>
        <h2>Telemetry</h2>

        <div id="telemetry">

            Loading data...

        </div>

        <!-- MAPA -->
        <div id="map"></div>

        <h2>Temperature</h2>

        <canvas id="tempChart"></canvas>

    </main>

    <footer>

        <p>&copy; 2026 Clara Ortega Bielsa</p>

    </footer>

    <script>

    // Mapa
    let map = L.map('map').setView([41.38, 2.17], 8);

    L.tileLayer(

        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

        {
            attribution: '&copy; OpenStreetMap contributors'
        }

    ).addTo(map);

    // Capa trajectòria
    let trajectoryLayer = null;

    // Gràfic
    const ctx = document
        .getElementById('tempChart')
        .getContext('2d');

    const labels = [];

    const temperatures = [];

    const tempChart = new Chart(ctx, {

        type: 'line',

        data: {

            labels: labels,

            datasets: [{

                label: 'Temperature (°C)',

                data: temperatures,

                borderWidth: 2
            }]
        },

        options: {

            responsive: true,

            scales: {

                y: {

                    beginAtZero: false
                }
            }
        }
    });

    // Carrega telemetria
    async function loadTelemetry() {

        try {

            const device = document.getElementById('deviceInput').value;
            const from = document.getElementById('fromDate').value;
            const to = document.getElementById('toDate').value;

            let url = `/api/telemetry?device_id=${device}`;

            if (from) url += `&from=${from}`;
            if (to) url += `&to=${to}`;

            const response = await fetch(url);
            const data = await response.json();

            console.log(data);

            //control d'errors backend
            if (!response.ok) {
                console.error(data);
                document.getElementById('telemetry').innerHTML =
                    'API error: ' + (data.error || 'unknown error');
                return;
            }

            //comprova format correcte
            if (!Array.isArray(data) || data.length === 0) {
                document.getElementById('telemetry').innerHTML = 'No hi ha dades';
                return;
            }

            // Últim registre
            const latest = data[data.length - 1];

            // Telemetria
            const container =
                document.getElementById('telemetry');

            container.innerHTML = `

                <p><strong>Timestamp (UTC):</strong>
                ${latest.timestamp}</p>

                <p><strong>Temperatura:</strong>
                ${latest.temperature} °C</p>

                <p><strong>Latitud:</strong>
                ${latest.lat}</p>

                <p><strong>Longitud:</strong>
                ${latest.lon}</p>

            `;

            // Gràfic
            labels.length = 0;
            temperatures.length = 0;

            data
                .filter(p =>
                    p.temperature !== null &&
                    !isNaN(p.temperature)
                )
                .forEach(point => {

                    labels.push(
                        new Date(point.timestamp)
                        .toLocaleString('ca-ES')
                    );

                    temperatures.push(
                        point.temperature
                    );
                });

            tempChart.update();

            // Mapa
            const coordinates = [];

            data.forEach(point => {
                if (point.lat && point.lon) {
                    const marker = L.circleMarker(
                        [point.lat, point.lon],
                        {
                            radius: 4,
                            fillColor: "blue",
                            color: "blue",
                            weight: 1,
                            fillOpacity: 0.8
                        }
                    ).addTo(trajectoryLayer);
                    marker.bindPopup(`
                        <b>${point.timestamp}</b><br>
                        Temperature: ${point.temperature} °C<br>
                        Lat: ${point.lat}<br>
                        Lon: ${point.lon}
                    `);
                }
            });

            // Eliminar trajectòria anterior
            if (trajectoryLayer) {

                map.removeLayer(trajectoryLayer);
            }

            // Crear capa nova
            trajectoryLayer =
                L.layerGroup().addTo(map);

            // Dibuixar trajectòria
            // Trajectòria fina
            L.polyline(
                coordinates,
                {
                    color: 'gray',
                    weight: 1,
                    opacity: 0.5
                }
            ).addTo(trajectoryLayer);
            // Punts
            coordinates.forEach(coord => {
                L.circleMarker(coord, {
                    radius: 4,
                    fillColor: "blue",
                    color: "blue",
                    weight: 1,
                    fillOpacity: 0.8
                }).addTo(trajectoryLayer);
            });
            // Últim punt
            const latestCoords =
                coordinates[coordinates.length - 1];

            L.circleMarker(latestCoords, {
                radius: 8,
                fillColor: "red",
                color: "red",
                weight: 2,
                fillOpacity: 1
            })
            .addTo(trajectoryLayer)
            .bindPopup("Última posició");
            // Ajustar vista
            map.fitBounds(coordinates);

        } catch (error) {

            console.error(error);

            document.getElementById('telemetry')
                .innerHTML =
                'Error loading data';
        }
    }

    // Primera càrrega
    loadTelemetry();

    // Actualitzar cada 5 minuts
    setInterval(loadTelemetry, 5 * 60000);

</script>

</body>

</html>
